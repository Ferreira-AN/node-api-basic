<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documento autêntico</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-img {
      width: 90px;
      height: auto;
      background: transparent !important;
      mix-blend-mode: multiply;
    }

    .titulo-principal {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #6b6b6b;
      margin-bottom: 18px;
    }

    .titulo-dados {
      font-size: 17px;
      font-weight: 700;
      color: #6b6b6b;
      margin-bottom: 14px;
      text-align: left;
    }

    .dados-lista {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }

    .dado-item {
      display: flex;
      flex-direction: column;
    }

    .dado-label {
      font-weight: 700;
      color: #6b6b6b;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .dado-valor {
      color: #6b6b6b;
      font-size: 15px;
      font-weight: 400;
    }

    #nome, #sobrenome {
      text-transform: uppercase;
    }

    /* BOTÃO VOLTAR - METADE AZUL, METADE TRANSPARENTE */
    .voltar-wrapper {
      text-align: center;
      margin-top: 5px;
    }

    .voltar-btn {
      display: inline-block;
      padding: 4px 6px;
      background: linear-gradient(to right, #4d8bf2 50%, transparent 50%);
      color: #6b6b6b; /* MESMA COR DAS OUTRAS PALAVRAS */
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
      width: auto;
      min-width: 0;
      letter-spacing: 0;
    }

    .voltar-btn:hover {
      background: linear-gradient(to right, #3a7ae0 50%, transparent 50%);
    }

    .loading {
      display: none;
      margin: 20px 0;
      color: #4d8bf2;
      text-align: center;
    }

    .error-message {
      display: none;
      margin: 20px 0;
      padding: 12px;
      background: #ffebee;
      color: #c62828;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="Federal.png" class="logo-img" alt="PF"
           onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/Bras%C3%A3o_PF_Brasil.svg/200px-Bras%C3%A3o_PF_Brasil.svg.png'">
    </div>

    <div class="titulo-principal">Documento autêntico</div>
    <div class="titulo-dados">Dados do documento</div>

    <div class="dados-lista" id="dados-cliente">
      <div class="dado-item">
        <div class="dado-label">Situacao:</div>
        <div class="dado-valor" id="validade">Carregando...</div>
      </div>
      <div class="dado-item">
        <div class="dado-label">Código:</div>
        <div class="dado-valor" id="codigo">-</div>
      </div>
      <div class="dado-item">
        <div class="dado-label">Nome:</div>
        <div class="dado-valor" id="nome">-</div>
      </div>
      <div class="dado-item">
        <div class="dado-label">Sobrenome:</div>
        <div class="dado-valor" id="sobrenome">-</div>
      </div>
      <div class="dado-item">
        <div class="dado-label">RNM:</div>
        <div class="dado-valor" id="rnm">-</div>
      </div>
      <div class="dado-item">
        <div class="dado-label">Data de nascimento:</div>
        <div class="dado-valor" id="nascimento">-</div>
      </div>
      <div class="dado-item">
        <div class="dado-label">Nacionalidade:</div>
        <div class="dado-valor" id="nacionalidade">-</div>
      </div>
    </div>

    <div class="voltar-wrapper">
      <a href="javascript:history.back()" class="voltar-btn">Voltar</a>
    </div>
  </div>

  <script>
    function getCodigoDaURL() {
      const urlParams = new URLSearchParams(window.location.search);
      let codigo = urlParams.get('codigo');
      if (!codigo) {
        const path = window.location.pathname;
        const partes = path.split('/');
        if (partes.includes('verificar')) codigo = partes[partes.length - 1];
      }
      return codigo;
    }

    function formatarData(dataStr) {
      if (!dataStr) return '';
      try {
        // Força interpretação como data local (sem fuso horário)
        const [ano, mes, dia] = dataStr.substring(0, 10).split('-');
        return dia + '/' + mes + '/' + ano;
      } catch { return dataStr; }
    }

    function capitalizar(texto) {
      if (!texto) return '';
      return texto.charAt(0).toUpperCase() + texto.slice(1).toLowerCase();
    }

    async function carregarCliente() {
      // Tenta pegar da URL, senão recupera do sessionStorage (ao atualizar página)
      let codigo = getCodigoDaURL();
      if (!codigo) codigo = sessionStorage.getItem('ultimo_codigo');
      if (!codigo) { alert('Código inválido'); window.location.href = '/'; return; }

      try {
        const resposta = await fetch(`/api/cliente/${codigo}`);
        if (!resposta.ok) throw new Error('Erro na rede');
        const dados = await resposta.json();

        if (dados.sucesso && dados.cliente) {
          const c = dados.cliente;

          const hoje = new Date();
          hoje.setHours(0,0,0,0);
          // Força data local sem fuso horário
          const [vAno, vMes, vDia] = c.data_validade.substring(0, 10).split('-');
          const validade = new Date(vAno, vMes - 1, vDia);

          const dataFormatada = formatarData(c.data_validade);
          document.getElementById('validade').textContent = validade >= hoje
            ? `Valido até: ${dataFormatada}`
            : `Expirado em: ${dataFormatada}`;

          document.getElementById('codigo').textContent = c.codigo_qr || '-';
          document.getElementById('nome').textContent = c.nome ? c.nome.toUpperCase() : '-';
          document.getElementById('sobrenome').textContent = c.sobrenome ? c.sobrenome.toUpperCase() : '-';
          document.getElementById('rnm').textContent = c.rnm || '-';
          document.getElementById('nascimento').textContent = formatarData(c.data_nascimento);
          document.getElementById('nacionalidade').textContent = c.nacionalidade ? capitalizar(c.nacionalidade) : '-';

          // Salva o código no sessionStorage para recuperar ao atualizar
          sessionStorage.setItem('ultimo_codigo', codigo);
          window.history.replaceState({}, '', '/');

        } else {
          alert('Documento não encontrado');
          window.location.href = '/';
        }
      } catch (erro) {
        console.error('Erro:', erro);
        alert('Erro ao carregar dados. Tente novamente.');
      }
    }

    document.addEventListener('DOMContentLoaded', carregarCliente);
  </script>
</body>
</html>
