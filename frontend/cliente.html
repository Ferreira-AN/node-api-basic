<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação de Documento</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .container {
      width: 95%; /* MAIS LARGO */
      max-width: 600px; /* MAIS LARGO */
      background: white;
      padding: 20px;
      border-radius: 0; /* SEM BORDAS ARREDONDADAS */
      box-shadow: none; /* SEM SOMBRA */
    }

    /* Logo */
    .logo {
      text-align: center;
      padding: 10px 0;
      margin-bottom: 10px;
    }

    .logo-img {
      width: 140px;
      height: auto;
    }

    /* Títulos */
    .titulo-principal {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #000;
      margin-bottom: 15px;
    }

    /* "Dados do documento" ALINHADO À ESQUERDA */
    .titulo-dados {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 15px;
      text-align: left; /* ESQUERDA */
      padding-left: 0; /* REMOVER PADDING */
    }

    /* Itens de dados */
    .dados-lista {
      display: flex;
      flex-direction: column;
      gap: 12px; /* MENOS ESPAÇO */
    }

    .dado-item {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .dado-label {
      font-weight: bold;
      color: #555;
      font-size: 15px;
      margin-bottom: 3px;
      text-transform: capitalize;
    }

    .dado-valor {
      color: #000;
      font-size: 16px;
      padding: 5px 0;
      border-bottom: 1px solid #eee;
      width: 100%;
    }

    /* Nome e Sobrenome em MAIÚSCULAS */
    #nome, #sobrenome {
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* Validade */
    #validade {
      font-weight: 600;
      color: #000;
    }

    /* Botão AZUL CLARO */
    .voltar-btn {
      display: block;
      width: 90%;
      max-width: 300px;
      background: #4d8bf2; /* AZUL CLARO */
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      text-align: center;
      cursor: pointer;
      margin: 25px auto 5px auto;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.3s;
    }

    .voltar-btn:hover {
      background: #3a7be0;
    }

    /* Responsividade */
    @media (min-width: 768px) {
      .container {
        width: 90%;
        max-width: 650px; /* AINDA MAIS LARGO */
        padding: 25px;
      }
      
      .logo {
        padding: 15px 0;
      }
      
      .logo-img {
        width: 150px;
      }
      
      .titulo-principal {
        font-size: 22px;
        margin-bottom: 20px;
      }
      
      .titulo-dados {
        font-size: 19px;
        margin-bottom: 18px;
      }
      
      .dados-lista {
        gap: 15px;
      }
      
      .dado-label {
        font-size: 16px;
      }
      
      .dado-valor {
        font-size: 17px;
      }
      
      .voltar-btn {
        padding: 14px;
        font-size: 17px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 5px; /* MENOS PADDING */
      }
      
      .container {
        width: 98%; /* QUASE 100% */
        padding: 15px;
      }
      
      .logo {
        padding: 8px 0;
        margin-bottom: 8px;
      }
      
      .logo-img {
        width: 120px;
      }
      
      .titulo-principal {
        font-size: 18px;
        margin-bottom: 12px;
      }
      
      .titulo-dados {
        font-size: 17px;
        margin-bottom: 12px;
        padding-left: 0;
      }
      
      .dados-lista {
        gap: 10px;
      }
      
      .dado-label {
        font-size: 14px;
      }
      
      .dado-valor {
        font-size: 15px;
        padding: 4px 0;
      }
      
      .voltar-btn {
        width: 95%;
        padding: 11px;
        font-size: 15px;
        margin: 20px auto 5px auto;
      }
    }

    @media (max-width: 360px) {
      .container {
        width: 100%; /* 100% DA TELA */
        padding: 12px;
      }
      
      .logo-img {
        width: 110px;
      }
      
      .dados-lista {
        gap: 8px;
      }
      
      .titulo-dados {
        margin-left: 0;
        padding-left: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <img src="/Federal.png" class="logo-img" 
           onerror="this.onerror=null; this.src='/PF.jpg';">
    </div>

    <!-- Título Principal -->
    <div class="titulo-principal">Documento autêntico</div>

    <!-- "Dados do documento" ALINHADO À ESQUERDA -->
    <div class="titulo-dados">Dados do documento</div>

    <!-- Lista de Dados -->
    <div class="dados-lista" id="dados-cliente">
      <div class="dado-item">
        <div class="dado-label">Situação</div>
        <div class="dado-valor" id="validade">Carregando...</div>
      </div>

      <div class="dado-item">
        <div class="dado-label">Código</div>
        <div class="dado-valor" id="codigo">-</div>
      </div>

      <div class="dado-item">
        <div class="dado-label">Nome</div>
        <div class="dado-valor" id="nome">-</div>
      </div>

      <div class="dado-item">
        <div class="dado-label">Sobrenome</div>
        <div class="dado-valor" id="sobrenome">-</div>
      </div>

      <div class="dado-item">
        <div class="dado-label">RNM</div>
        <div class="dado-valor" id="rnm">-</div>
      </div>

      <div class="dado-item">
        <div class="dado-label">Data de nascimento</div>
        <div class="dado-valor" id="nascimento">-</div>
      </div>

      <div class="dado-item">
        <div class="dado-label">Nacionalidade</div>
        <div class="dado-valor" id="nacionalidade">-</div>
      </div>
    </div>

    <!-- Botão AZUL CLARO -->
    <a href="/" class="voltar-btn">VOLTAR</a>
  </div>

  <script>
    // ============================================
    // FUNÇÕES
    // ============================================

    function getCodigoDaURL() {
      const caminho = window.location.pathname;
      const partes = caminho.split('/');
      const codigo = partes[partes.length - 1];
      return codigo !== 'verificar' ? codigo : null;
    }

    function formatarData(dataStr) {
      if (!dataStr) return '';
      try {
        return new Date(dataStr).toLocaleDateString('pt-BR');
      } catch {
        return dataStr;
      }
    }

    function capitalizar(texto) {
      if (!texto) return '';
      return texto.charAt(0).toUpperCase() + texto.slice(1).toLowerCase();
    }

    // ============================================
    // CARREGAR DADOS
    // ============================================

    async function carregarCliente() {
      const codigo = getCodigoDaURL();
      
      if (!codigo) {
        alert('Código inválido');
        window.location.href = '/';
        return;
      }

      try {
        const resposta = await fetch(`/api/cliente/${codigo}`);
        
        if (!resposta.ok) {
          throw new Error('Erro na rede');
        }
        
        const dados = await resposta.json();

        if (dados.sucesso && dados.cliente) {
          const c = dados.cliente;
          
          // Verificar validade
          const hoje = new Date();
          const validade = new Date(c.data_validade);
          hoje.setHours(0, 0, 0, 0);
          validade.setHours(0, 0, 0, 0);
          
          const valido = validade >= hoje;
          
          // Situação
          const validadeElemento = document.getElementById('validade');
          const dataFormatada = formatarData(c.data_validade);
          
          if (valido) {
            validadeElemento.textContent = `Válido até ${dataFormatada}`;
          } else {
            validadeElemento.textContent = `Expirado em ${dataFormatada}`;
          }
          
          // Preencher dados
          document.getElementById('codigo').textContent = c.codigo_qr || '-';
          document.getElementById('nome').textContent = c.nome ? c.nome.toUpperCase() : '-';
          document.getElementById('sobrenome').textContent = c.sobrenome ? c.sobrenome.toUpperCase() : '-';
          document.getElementById('rnm').textContent = c.rnm ? capitalizar(c.rnm) : '-';
          document.getElementById('nascimento').textContent = formatarData(c.data_nascimento);
          document.getElementById('nacionalidade').textContent = c.nacionalidade ? capitalizar(c.nacionalidade) : '-';
          
        } else {
          alert('Documento não encontrado');
          window.location.href = '/';
        }
      } catch (erro) {
        console.error('Erro:', erro);
        alert('Erro ao carregar dados. Tente novamente.');
      }
    }

    // ============================================
    // INICIAR
    // ============================================

    document.addEventListener('DOMContentLoaded', carregarCliente);

    // Fallback para imagem
    window.addEventListener('load', function() {
      const img = document.querySelector('.logo-img');
      img.onerror = function() {
        this.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/Bras%C3%A3o_PF_Brasil.svg/200px-Bras%C3%A3o_PF_Brasil.svg.png';
      };
    });
  </script>
</body>
</html>
