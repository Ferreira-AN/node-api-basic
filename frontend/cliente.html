<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação de Documento</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-img {
      width: 90px;
      height: auto;
    }

    .titulo-principal {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #6b6b6b;
      margin-bottom: 18px;
    }

    .titulo-dados {
      font-size: 17px;
      font-weight: 700;
      color: #6b6b6b;
      margin-bottom: 14px;
      text-align: left;
    }

    .dados-lista {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }

    .dado-item {
      display: flex;
      flex-direction: column;
    }

    .dado-label {
      font-weight: 700;
      color: #6b6b6b;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .dado-valor {
      color: #6b6b6b;
      font-size: 15px;
      font-weight: 400;
    }

    #nome, #sobrenome {
      text-transform: uppercase;
    }

    .voltar-btn {
      display: block;
      width: 120px;
      background: #e0e0e0;
      color: #444;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 15px;
      text-align: center;
      cursor: pointer;
      margin: 0 auto;
      font-weight: 500;
      text-decoration: none;
    }

    .voltar-btn:hover {
      background: #d0d0d0;
    }

    .loading {
      display: none;
      margin: 20px 0;
      color: #4d8bf2;
      text-align: center;
    }

    .error-message {
      display: none;
      margin: 20px 0;
      padding: 12px;
      background: #ffebee;
      color: #c62828;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/Federal.png" class="logo-img"
           onerror="this.onerror=null; this.src='/PF.jpg';">
    </div>

    <div class="titulo-principal">Documento autêntico</div>
    <div class="titulo-dados">Dados do documento</div>

    <div class="dados-lista" id="dados-cliente">
      <div class="dado-item">
        <div class="dado-label">Situacao:</div>
        <div class="dado-valor" id="validade">Carregando...</div>
      </div>
      <div class="dado-item">
        <div class="dado-label">Código:</div>
        <div class="dado-valor" id="codigo">-</div>
      </div>
      <div class="dado-item">
        <div class="dado-label">Nome:</div>
        <div class="dado-valor" id="nome">-</div>
      </div>
      <div class="dado-item">
        <div class="dado-label">Sobrenome:</div>
        <div class="dado-valor" id="sobrenome">-</div>
      </div>
      <div class="dado-item">
        <div class="dado-label">RNM:</div>
        <div class="dado-valor" id="rnm">-</div>
      </div>
      <div class="dado-item">
        <div class="dado-label">Data de nascimento:</div>
        <div class="dado-valor" id="nascimento">-</div>
      </div>
      <div class="dado-item">
        <div class="dado-label">Nacionalidade:</div>
        <div class="dado-valor" id="nacionalidade">-</div>
      </div>
    </div>

    <a href="/validador" class="voltar-btn">Voltar</a>
  </div>

  <script>
    function getCodigoDaURL() {
      const urlParams = new URLSearchParams(window.location.search);
      let codigo = urlParams.get('codigo');
      if (!codigo) {
        const path = window.location.pathname;
        const partes = path.split('/');
        if (partes.includes('verificar')) codigo = partes[partes.length - 1];
      }
      return codigo;
    }

    function formatarData(dataStr) {
      if (!dataStr) return '';
      try { return new Date(dataStr).toLocaleDateString('pt-BR'); }
      catch { return dataStr; }
    }

    function capitalizar(texto) {
      if (!texto) return '';
      return texto.charAt(0).toUpperCase() + texto.slice(1).toLowerCase();
    }

    async function carregarCliente() {
      const codigo = getCodigoDaURL();
      if (!codigo) { alert('Código inválido'); window.location.href = '/'; return; }

      try {
        const resposta = await fetch(`/api/cliente/${codigo}`);
        if (!resposta.ok) throw new Error('Erro na rede');
        const dados = await resposta.json();

        if (dados.sucesso && dados.cliente) {
          const c = dados.cliente;

          const hoje = new Date();
          const validade = new Date(c.data_validade);
          hoje.setHours(0,0,0,0);
          validade.setHours(0,0,0,0);

          const dataFormatada = formatarData(c.data_validade);
          document.getElementById('validade').textContent = validade >= hoje
            ? `Valido até: ${dataFormatada}`
            : `Expirado em: ${dataFormatada}`;

          document.getElementById('codigo').textContent = c.codigo_qr || '-';
          document.getElementById('nome').textContent = c.nome ? c.nome.toUpperCase() : '-';
          document.getElementById('sobrenome').textContent = c.sobrenome ? c.sobrenome.toUpperCase() : '-';
          document.getElementById('rnm').textContent = c.rnm || '-';
          document.getElementById('nascimento').textContent = formatarData(c.data_nascimento);
          document.getElementById('nacionalidade').textContent = c.nacionalidade ? capitalizar(c.nacionalidade) : '-';

          // Limpa a URL — mostra só o domínio
          window.history.replaceState({}, '', '/');

        } else {
          alert('Documento não encontrado');
          window.location.href = '/';
        }
      } catch (erro) {
        console.error('Erro:', erro);
        alert('Erro ao carregar dados. Tente novamente.');
      }
    }

    document.addEventListener('DOMContentLoaded', carregarCliente);
  </script>
</body>
</html>
