
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Polícia Federal - Validador</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f0f0f0; /* UM POUCO MAIS ESCURO */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 30px 16px 16px 16px;
    }

    .container { max-width: 400px; width: 100%; text-align: center; }
    .logo { margin: 12px 0 10px; }

    .logo-img {
      width: 90px;
      height: auto;
      mix-blend-mode: multiply;
    }

    .titulo-validador {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 20px;
      line-height: 1.3;
      text-align: center;
    }

    .codigo-wrapper {
      position: relative;
      width: 100%;
      max-width: 300px; /* REDUZIDO */
      margin: 0 auto 10px auto;
    }

    .codigo-label {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 10px;
      color: #888;
      font-weight: 500;
      pointer-events: none;
      letter-spacing: 0.3px;
    }

    .codigo-input {
      width: 100%;
      padding: 8px 12px; /* REDUZIDO */
      font-size: 14px; /* REDUZIDO */
      font-family: monospace;
      border: 1.5px solid #4d8bf2;
      border-radius: 8px;
      background: #f9f9f9;
      color: #222;
    }

    .codigo-input:focus {
      outline: none;
      border-color: #4d8bf2;
      background: white;
      box-shadow: 0 0  1px rgba(102, 175, 233, 0.4);
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }

    .btn-validar {
      padding: 8px 22px;
      background: #4d8bf2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      min-width: 80px;
    }

    .btn-validar:hover { background: #3a7ae0; }

    .btn-limpar {
      padding: 8px 22px;
      background: #4d8bf2; /* MESMA COR DO VALIDAR */
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      min-width: 80px;
    }

    .btn-limpar:hover { background: #3a7ae0; }

    .loading { display: none !important; }

    .error-message {
      display: none;
      margin: 12px auto;
      padding: 10px;
      background: #ffebee;
      color: #c62828;
      border-radius: 6px;
      font-size: 13px;
      width: 100%;
      max-width: 300px; /* ACOMPANHA A CAIXA */
    }

    @media (max-width: 480px) {
      body { padding: 20px 14px 14px 14px; }
      .container { max-width: 100%; }
      .logo-img { width: 180px; }
      .titulo-validador { font-size: 18px; margin-bottom: 16px; }
      .codigo-wrapper { max-width: 270px; }
      .codigo-input { font-size: 11px; padding: 20px 8px 6px 8px; }
      .buttons { gap: 5px; }
      .btn-validar, .btn-limpar { font-size: 13px; padding: 7px 16px; min-width: 65px; }
      .error-message { max-width: 270px; }
    }

    @media (max-width: 380px) {
      .logo-img { width: 150px; }
      .titulo-validador { font-size: 16px; }
      .codigo-wrapper { max-width: 230px; }
      .buttons { gap: 4px; flex-direction: column; align-items: center; }
      .btn-validar, .btn-limpar { width: 100%; max-width: 180px; min-width: unset; padding: 8px; }
      .error-message { max-width: 230px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="logo">
    <img src="Federal.png" class="logo-img" alt="PF"
         onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/Bras%C3%A3o_PF_Brasil.svg/200px-Bras%C3%A3o_PF_Brasil.svg.png'">
  </div>

  <div class="titulo-validador">Validador de autenticidade<br>de documento</div>

  <div class="codigo-wrapper">
    <div class="codigo-label">Código Verificador</div>
    <input type="text" id="codigoInput" class="codigo-input" autocomplete="off">
  </div>

  <div class="buttons">
    <button class="btn-validar" onclick="validarCodigo()">Validar</button>
    <button class="btn-limpar" onclick="limparCampo()">Limpar</button>
  </div>

  <div id="loading" class="loading"></div>
  <div id="errorMessage" class="error-message">❌ Documento não encontrado</div>
</div>

<script>
  function getCodigoDaURL() {
    const urlParams = new URLSearchParams(window.location.search);
    let codigo = urlParams.get('codigo');
    if (!codigo) {
      const path = window.location.pathname;
      const partes = path.split('/');
      if (partes.includes('verificar')) codigo = partes[partes.length - 1];
    }
    return codigo;
  }

  async function validarCodigo() {
    let codigo = document.getElementById('codigoInput').value.trim();
    if (!codigo) codigo = getCodigoDaURL();
    if (!codigo) { mostrarErro('Digite o código do documento'); return; }

    document.getElementById('errorMessage').style.display = 'none';

    try {
      const resposta = await fetch(`/api/cliente/${encodeURIComponent(codigo)}`);
      const dados = await resposta.json();
      if (dados.sucesso && dados.cliente) {
        document.getElementById('codigoInput').value = '';
        window.location.href = `/cliente.html?codigo=${encodeURIComponent(codigo)}`;
      } else {
        mostrarErro('Documento não encontrado');
      }
    } catch (erro) {
      mostrarErro('Erro de conexão');
    }
  }

  function limparCampo() {
    document.getElementById('codigoInput').value = '';
    document.getElementById('errorMessage').style.display = 'none';
    document.getElementById('codigoInput').focus();
  }

  function mostrarErro(msg) {
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.textContent = `❌ ${msg}`;
    errorDiv.style.display = 'block';
  }

  document.addEventListener('DOMContentLoaded', function() {
    const codigoURL = getCodigoDaURL();
    if (codigoURL) document.getElementById('codigoInput').value = codigoURL;
  });

  document.getElementById('codigoInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') validarCodigo();
  });
</script>
</body>
</html>
