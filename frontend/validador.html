<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Polícia Federal - Validador</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: white;
      text-align: center;
    }

    /* Logo PF */
    .logo {
      margin: 30px 0 20px;
    }

    .logo-img {
      width: 80px;
      height: auto;
    }

    /* Título Validador de autenticidade de documento */
    .titulo-validador {
      font-size: 22px;
      font-weight: bold;
      color: #1a2a3a;
      letter-spacing: 1px;
      margin-bottom: 30px;
      text-transform: lowercase;
    }

    .titulo-validador::first-letter {
      text-transform: uppercase;
    }

    /* Campo do código com label dentro */
    .codigo-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 25px;
    }

    .codigo-label {
      position: absolute;
      top: 12px;
      left: 14px;
      font-size: 12px;
      color: #888;
      font-weight: normal;
      pointer-events: none;
    }

    .codigo-input {
      width: 100%;
      padding: 28px 16px 12px 16px;
      font-size: 14px;
      font-family: monospace;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    .codigo-input:focus {
      outline: none;
      border-color: #005aa5;
    }

    /* Botões */
    .buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 40px;
    }

    .btn-validar {
      flex: 1;
      padding: 14px;
      background: #005aa5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-limpar {
      flex: 1;
      padding: 14px;
      background: #e0e0e0;
      color: #333;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Rodapé */
    .footer {
      font-size: 12px;
      color: #888;
      margin-top: 30px;
      padding-bottom: 20px;
    }

    /* Loading e erro */
    .loading {
      display: none;
      margin: 20px 0;
      color: #005aa5;
    }

    .error-message {
      display: none;
      margin: 20px 0;
      padding: 12px;
      background: #ffebee;
      color: #c62828;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Logo PF -->
  <div class="logo">
    <img src="Federal.png" class="logo-img" alt="PF" 
         onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/Bras%C3%A3o_PF_Brasil.svg/200px-Bras%C3%A3o_PF_Brasil.svg.png'">
  </div>

  <!-- Título -->
  <div class="titulo-validador">Validador de autenticidade de documento</div>

  <!-- Campo com label dentro -->
  <div class="codigo-wrapper">
    <div class="codigo-label">Código Verificador</div>
    <input type="text" id="codigoInput" class="codigo-input" 
           placeholder="dR213y70-8686-f308-11p8-95d58edk11yf" autocomplete="off">
  </div>

  <!-- Botões -->
  <div class="buttons">
    <button class="btn-validar" onclick="validarCodigo()">Validar</button>
    <button class="btn-limpar" onclick="limparCampo()">Limpar</button>
  </div>

  <!-- Loading e Erro -->
  <div id="loading" class="loading">⏳ Validando...</div>
  <div id="errorMessage" class="error-message">❌ Documento não encontrado</div>

  <!-- Rodapé -->
  <div class="footer">gov.br.dpf.digital</div>
</div>

<script>
  // Pegar código da URL (se veio do QR Code)
  function getCodigoDaURL() {
    const urlParams = new URLSearchParams(window.location.search);
    let codigo = urlParams.get('codigo');
    
    if (!codigo) {
      const path = window.location.pathname;
      const partes = path.split('/');
      if (partes.includes('verificar')) {
        codigo = partes[partes.length - 1];
      }
    }
    return codigo;
  }

  // Validar código
  async function validarCodigo() {
    let codigo = document.getElementById('codigoInput').value.trim();
    
    if (!codigo) {
      codigo = getCodigoDaURL();
    }
    
    if (!codigo) {
      mostrarErro('Digite o código do documento');
      return;
    }

    document.getElementById('loading').style.display = 'block';
    document.getElementById('errorMessage').style.display = 'none';

    try {
      const resposta = await fetch(`/api/cliente/${encodeURIComponent(codigo)}`);
      const dados = await resposta.json();

      if (dados.sucesso && dados.cliente) {
        window.location.href = `/cliente.html?codigo=${encodeURIComponent(codigo)}`;
      } else {
        mostrarErro('Documento não encontrado');
      }
    } catch (erro) {
      mostrarErro('Erro de conexão');
    } finally {
      document.getElementById('loading').style.display = 'none';
    }
  }

  function limparCampo() {
    document.getElementById('codigoInput').value = '';
    document.getElementById('errorMessage').style.display = 'none';
    document.getElementById('codigoInput').focus();
  }

  function mostrarErro(msg) {
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.textContent = `❌ ${msg}`;
    errorDiv.style.display = 'block';
  }

  // Carregar código da URL automaticamente
  document.addEventListener('DOMContentLoaded', function() {
    const codigoURL = getCodigoDaURL();
    if (codigoURL) {
      document.getElementById('codigoInput').value = codigoURL;
      //setTimeout(() => validarCodigo(), 300);
    }
  });

  // Enter no campo
  document.getElementById('codigoInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') validarCodigo();
  });
</script>
</body>
</html>
