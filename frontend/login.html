<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00254d, #005aa5);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 350px;
        }
        .logo { font-size: 32px; font-weight: bold; margin-bottom: 30px; }
        .logo span:nth-child(1) { color: #005aa5; }
        .logo span:nth-child(2) { color: #4ca146; }
        .logo span:nth-child(3) { color: #ffcc00; }
        h1 { color: #00254d; margin-bottom: 30px; font-size: 24px; }
        input {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 2px solid #ddd; border-radius: 8px;
            font-size: 16px; box-sizing: border-box;
        }
        input:focus { border-color: #005aa5; outline: none; }
        button {
            width: 100%; padding: 14px; background: #005aa5;
            color: white; border: none; border-radius: 8px;
            font-size: 18px; cursor: pointer; margin-top: 20px; font-weight: bold;
        }
        button:hover { background: #004080; }
        .error {
            color: #c62828; background: #ffebee;
            padding: 10px; border-radius: 5px; margin: 10px 0; display: none;
        }
        .info { color: #666; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <span>QR</span><span>CODE</span><span> SYSTEM</span>
        </div>
        <h1>🔐 Acesso Restrito</h1>
        <div class="error" id="error-message">Utilizador ou senha incorretos!</div>

        <input type="text" id="usuario" placeholder="Utilizador" autocomplete="username">
        <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">

        <button onclick="fazerLogin()">ENTRAR NO PAINEL</button>
        <div class="info">Apenas pessoal autorizado<br>Sistema de cadastro de clientes</div>
    </div>

    <script>
        async function fazerLogin() {
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value;
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'none';

            if (!usuario || !senha) {
                errorDiv.textContent = 'Preencha utilizador e senha!';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });
                const result = await response.json();

                if (result.sucesso) {
                    localStorage.setItem('admin_token', result.token);
                    localStorage.setItem('admin_usuario', result.usuario);
                    localStorage.setItem('login_time', Date.now().toString());
                    window.location.href = 'admin.html';
                } else {
                    errorDiv.textContent = result.erro || 'Utilizador ou senha incorretos!';
                    errorDiv.style.display = 'block';
                    document.getElementById('senha').value = '';
                    document.getElementById('senha').style.borderColor = '#c62828';
                    setTimeout(() => document.getElementById('senha').style.borderColor = '#ddd', 1000);
                }
            } catch (err) {
                errorDiv.textContent = 'Erro de conexão. Tente novamente.';
                errorDiv.style.display = 'block';
            }
        }

        // Enter para enviar
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') fazerLogin();
        });

        // Se já estiver logado, redireciona direto
        const token = localStorage.getItem('admin_token');
        const loginTime = localStorage.getItem('login_time');
        if (token && loginTime) {
            const horas = (Date.now() - parseInt(loginTime)) / (1000 * 60 * 60);
            if (horas < 8) window.location.href = 'admin.html';
            else { localStorage.removeItem('admin_token'); localStorage.removeItem('admin_usuario'); }
        }
    </script>
</body>
</html>
